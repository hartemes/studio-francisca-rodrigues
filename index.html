<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio Francisca Rodrigues</title>

<style>

body{
font-family:Arial;
margin:0;
background:#fafafa;
color:#333;
}

header{
background:linear-gradient(45deg,#d6336c,#ff7aa2);
color:white;
text-align:center;
padding:40px;
}

nav{
background:white;
padding:12px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

nav a{
margin:0 15px;
text-decoration:none;
color:#d6336c;
font-weight:bold;
}

section{
max-width:900px;
margin:auto;
padding:30px 20px;
}

h2{
text-align:center;
color:#d6336c;
}

.servicos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
cursor:pointer;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

form{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

form input,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:6px;
border:1px solid #ccc;
}

button{
background:#d6336c;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#b52d5b;
}

.horarios{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
gap:10px;
margin-top:15px;
}

.hora{
background:#eee;
padding:10px;
border-radius:6px;
text-align:center;
cursor:pointer;
}

.hora.selecionado{
background:#d6336c;
color:white;
}

.hora.ocupado{
background:#999;
color:white;
cursor:not-allowed;
}

.lista{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.admin{
display:none;
}

.cancelar{
background:red;
margin-top:5px;
}

footer{
background:#d6336c;
color:white;
text-align:center;
padding:15px;
margin-top:40px;
}

</style>

</head>

<body>

<header>
<h1>Studio Francisca Rodrigues</h1>
<p>Beleza e cuidado em cada detalhe</p>
</header>

<nav>
<a href="#servicos">Serviços</a>
<a href="#agendamento">Agendar</a>
<a href="#agenda">Agenda</a>
<a href="#" onclick="abrirAdmin()">Admin</a>
</nav>

<section id="servicos">

<h2>Escolha o serviço</h2>

<div class="servicos">

<div class="card" onclick="selecionarServico('Unhas')">💅 Unhas</div>
<div class="card" onclick="selecionarServico('Escova')">💇 Escova</div>
<div class="card" onclick="selecionarServico('Hidratação')">✨ Hidratação</div>
<div class="card" onclick="selecionarServico('Selagem')">💎 Selagem</div>
<div class="card" onclick="selecionarServico('Sobrancelha')">👁️ Sobrancelha</div>
<div class="card" onclick="selecionarServico('Henna')">🖌️ Henna</div>
<div class="card" onclick="selecionarServico('Maquiagem')">💄 Maquiagem</div>

</div>

</section>

<section id="agendamento">

<h2>Agendamento</h2>

<form id="form">

<label>Nome</label>
<input type="text" id="nome" required>

<label>Telefone</label>
<input type="tel" id="telefone" required>

<label>Serviço</label>
<input type="text" id="servico" readonly required>

<label>Data</label>
<input type="date" id="data" required>

<label>Horário</label>

<div class="horarios" id="horarios"></div>

<input type="hidden" id="hora">

<button type="submit">Confirmar Agendamento</button>

</form>

</section>

<section id="agenda">

<h2>Agendamentos</h2>

<div class="lista" id="lista"></div>

</section>

<section id="admin" class="admin">

<h2>Painel Administrador</h2>

<div class="lista" id="adminLista"></div>

</section>

<footer>
Studio Francisca Rodrigues
</footer>

<script>

const horarios=[
"08:00","09:00","10:00","11:00",
"13:00","14:00","15:00","16:00","17:00","18:00"
]

function carregarHorarios(){

const container=document.getElementById("horarios")
container.innerHTML=""

const data=document.getElementById("data").value

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

horarios.forEach(h=>{

let div=document.createElement("div")
div.className="hora"
div.innerText=h

const ocupado=agenda.find(a=>a.data===data && a.hora===h)

if(ocupado){
div.classList.add("ocupado")
}else{

div.onclick=()=>{

document.querySelectorAll(".hora")
.forEach(el=>el.classList.remove("selecionado"))

div.classList.add("selecionado")
document.getElementById("hora").value=h

}

}

container.appendChild(div)

})

}

document.getElementById("data").addEventListener("change",carregarHorarios)

function selecionarServico(s){
document.getElementById("servico").value=s
document.getElementById("agendamento").scrollIntoView({behavior:"smooth"})
}

function atualizarLista(){

const lista=document.getElementById("lista")
const adminLista=document.getElementById("adminLista")

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

lista.innerHTML=""
adminLista.innerHTML=""

agenda.forEach((a,i)=>{

lista.innerHTML+=`
<p>
<b>${a.nome}</b><br>
${a.servico}<br>
${a.data} - ${a.hora}
</p><hr>
`

adminLista.innerHTML+=`
<p>
<b>${a.nome}</b><br>
${a.servico}<br>
${a.data} - ${a.hora}
<br>
<button class="cancelar" onclick="cancelar(${i})">Cancelar</button>
</p><hr>
`

})

}

function cancelar(i){

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

agenda.splice(i,1)

localStorage.setItem("agenda",JSON.stringify(agenda))

atualizarLista()
carregarHorarios()

}

function abrirAdmin(){

const senha=prompt("Digite a senha")

if(senha==="1234"){
document.getElementById("admin").style.display="block"
window.location="#admin"
}else{
alert("Senha incorreta")
}

}

document.getElementById("form").addEventListener("submit",function(e){

e.preventDefault()

const nome=document.getElementById("nome").value
const telefone=document.getElementById("telefone").value
const servico=document.getElementById("servico").value
const data=document.getElementById("data").value
const hora=document.getElementById("hora").value

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

agenda.push({nome,telefone,servico,data,hora})

localStorage.setItem("agenda",JSON.stringify(agenda))

atualizarLista()
carregarHorarios()

alert("Agendamento confirmado!")

})

atualizarLista()

</script>

</body>
</html>
