<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio Francisca Rodrigues</title>

<style>

body{
font-family:Arial;
margin:0;
background:#fafafa;
}

header{
background:linear-gradient(45deg,#d6336c,#ff7aa2);
color:white;
text-align:center;
padding:40px;
}

section{
max-width:1000px;
margin:auto;
padding:25px;
}

.card-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
cursor:pointer;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

form{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

form input,select,button{
width:100%;
padding:10px;
margin-top:10px;
}

.horarios{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
gap:10px;
margin-top:15px;
}

.hora{
background:#eee;
padding:10px;
text-align:center;
border-radius:6px;
cursor:pointer;
}

.hora.selecionado{
background:#d6336c;
color:white;
}

.hora.ocupado{
background:#888;
color:white;
cursor:not-allowed;
}

.lista{
background:white;
padding:15px;
border-radius:10px;
margin-top:20px;
}

.francisca{border-left:6px solid #ff4d6d;}
.vanessa{border-left:6px solid #ff9f1c;}
.leila{border-left:6px solid #4dabf7;}

.cancelar{
background:red;
color:white;
margin-top:5px;
}

.stats{
display:flex;
gap:20px;
margin-top:20px;
}

.stat{
background:white;
padding:15px;
border-radius:10px;
flex:1;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<header>

<h1>Studio Francisca Rodrigues</h1>
<p>Sistema de Agendamento</p>

</header>

<section>

<h2>Serviços</h2>

<div class="card-grid">

<div class="card" onclick="selecionarServico('Unhas')">💅 Unhas</div>
<div class="card" onclick="selecionarServico('Cabelo')">💇 Cabelo</div>
<div class="card" onclick="selecionarServico('Hidratação')">✨ Hidratação</div>

</div>

</section>

<section>

<h2>Agendar</h2>

<form id="form">

<input type="text" id="nome" placeholder="Nome" required>

<input type="tel" id="telefone" placeholder="Telefone" required>

<input type="text" id="servico" placeholder="Serviço" readonly required>

<select id="profissional"></select>

<input type="date" id="data" required>

<div class="horarios" id="horarios"></div>

<input type="hidden" id="hora">

<button>Confirmar Agendamento</button>

</form>

</section>

<section>

<div class="stats">

<div class="stat">
<h3 id="clientesHoje">0</h3>
Clientes Hoje
</div>

<div class="stat">
<h3 id="faturamentoHoje">R$0</h3>
Faturamento Estimado
</div>

</div>

</section>

<section>

<h2>Agenda</h2>

<div id="lista" class="lista"></div>

</section>

<script>

const horarios=[
"08:00","09:00","10:00","11:00",
"13:00","14:00","15:00","16:00","17:00"
]

const profissionais={
Unhas:["Francisca","Vanessa"],
Cabelo:["Leila","Francisca"],
Hidratação:["Leila"]
}

const precos={
Unhas:40,
Cabelo:50,
Hidratação:30
}

function selecionarServico(servico){

document.getElementById("servico").value=servico

const select=document.getElementById("profissional")

select.innerHTML=""

profissionais[servico].forEach(p=>{

let option=document.createElement("option")
option.value=p
option.textContent=p

select.appendChild(option)

})

carregarHorarios()

}

document.getElementById("data").addEventListener("change",carregarHorarios)
document.getElementById("profissional").addEventListener("change",carregarHorarios)

function carregarHorarios(){

const data=document.getElementById("data").value
const profissional=document.getElementById("profissional").value

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

const container=document.getElementById("horarios")

container.innerHTML=""

horarios.forEach(h=>{

let div=document.createElement("div")

div.className="hora"
div.innerText=h

const ocupado=agenda.some(a =>
a.data===data &&
a.hora===h &&
a.profissional===profissional
)

if(ocupado){

div.classList.add("ocupado")

}else{

div.onclick=()=>{

document.querySelectorAll(".hora")
.forEach(el=>el.classList.remove("selecionado"))

div.classList.add("selecionado")

document.getElementById("hora").value=h

}

}

container.appendChild(div)

})

}

function atualizarLista(){

const lista=document.getElementById("lista")

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

lista.innerHTML=""

let clientesHoje=0
let faturamento=0

const hoje=new Date().toISOString().slice(0,10)

agenda.forEach((a,i)=>{

let classe=a.profissional.toLowerCase()

lista.innerHTML+=`

<div class="${classe}">
<b>Cliente</b><br>
${a.servico}<br>
${a.profissional}<br>
${a.data} ${a.hora}
</div>
<hr>

`

if(a.data===hoje){

clientesHoje++

faturamento+=precos[a.servico]||0

}

})

document.getElementById("clientesHoje").innerText=clientesHoje

document.getElementById("faturamentoHoje").innerText="R$"+faturamento

}

document.getElementById("form").addEventListener("submit",function(e){

e.preventDefault()

const nome=document.getElementById("nome").value
const telefone=document.getElementById("telefone").value
const servico=document.getElementById("servico").value
const profissional=document.getElementById("profissional").value
const data=document.getElementById("data").value
const hora=document.getElementById("hora").value

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

const ocupado=agenda.some(a =>
a.data===data &&
a.hora===hora &&
a.profissional===profissional
)

if(ocupado){

alert(profissional+" não está disponível nesse horário.")

return

}

agenda.push({nome,telefone,servico,profissional,data,hora})

localStorage.setItem("agenda",JSON.stringify(agenda))

const msg=`Novo agendamento

${nome}
${telefone}
${servico}
${profissional}
${data} ${hora}`

window.open("https://wa.me/5586988391451?text="+encodeURIComponent(msg))

alert("Agendamento confirmado!")

atualizarLista()
carregarHorarios()

})

atualizarLista()

</script>

</body>
</html>
