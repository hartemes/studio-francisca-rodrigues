<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio Francisca Rodrigues</title>

<style>

body{
font-family:Arial;
margin:0;
background:#fafafa;
}

header{
background:linear-gradient(45deg,#d6336c,#ff7aa2);
color:white;
text-align:center;
padding:40px;
}

section{
max-width:900px;
margin:auto;
padding:30px;
}

.servicos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
cursor:pointer;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

form{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

form input,select,button{
width:100%;
padding:10px;
margin-top:10px;
}

.horarios{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
gap:10px;
margin-top:15px;
}

.hora{
background:#eee;
padding:10px;
text-align:center;
border-radius:6px;
cursor:pointer;
}

.hora.selecionado{
background:#d6336c;
color:white;
}

.hora.ocupado{
background:#999;
color:white;
cursor:not-allowed;
}

.lista{
background:white;
padding:15px;
border-radius:10px;
margin-top:20px;
}

.admin{
display:none;
}

.cancelar{
background:red;
color:white;
}

</style>

</head>

<body>

<header>
<h1>Studio Francisca Rodrigues</h1>
<p>Agendamento Online</p>
</header>

<section>

<h2>Serviços</h2>

<div class="servicos">

<div class="card" onclick="selecionarServico('Unhas')">💅 Unhas</div>
<div class="card" onclick="selecionarServico('Cabelo')">💇 Cabelo</div>
<div class="card" onclick="selecionarServico('Hidratação')">✨ Hidratação</div>

</div>

</section>

<section>

<h2>Agendar</h2>

<form id="form">

<label>Nome</label>
<input type="text" id="nome" required>

<label>Telefone</label>
<input type="tel" id="telefone" required>

<label>Serviço</label>
<input type="text" id="servico" readonly required>

<label>Profissional</label>
<select id="profissional"></select>

<label>Data</label>
<input type="date" id="data" required>

<label>Horário</label>

<div class="horarios" id="horarios"></div>

<input type="hidden" id="hora">

<button>Confirmar Agendamento</button>

</form>

</section>

<section>

<h2>Agenda</h2>

<div class="lista" id="lista"></div>

</section>

<section id="admin" class="admin">

<h2>Painel Administrador</h2>

<div class="lista" id="adminLista"></div>

</section>

<script>

const horarios=[
"08:00","09:00","10:00","11:00",
"13:00","14:00","15:00","16:00","17:00"
]

const profissionais={

Unhas:["Francisca","Vanessa"],

Cabelo:["Leila","Francisca"],

Hidratação:["Leila"]

}

function selecionarServico(servico){

document.getElementById("servico").value=servico

const select=document.getElementById("profissional")

select.innerHTML=""

profissionais[servico].forEach(p=>{

let option=document.createElement("option")

option.value=p
option.textContent=p

select.appendChild(option)

})

}

function carregarHorarios(){

const data=document.getElementById("data").value
const profissional=document.getElementById("profissional").value

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

const container=document.getElementById("horarios")

container.innerHTML=""

horarios.forEach(h=>{

let div=document.createElement("div")

div.className="hora"

div.innerText=h

const ocupado=agenda.find(a=>a.data===data && a.hora===h && a.profissional===profissional)

if(ocupado){

div.classList.add("ocupado")

}else{

div.onclick=()=>{

document.querySelectorAll(".hora")
.forEach(el=>el.classList.remove("selecionado"))

div.classList.add("selecionado")

document.getElementById("hora").value=h

}

}

container.appendChild(div)

})

}

document.getElementById("data").addEventListener("change",carregarHorarios)

document.getElementById("profissional").addEventListener("change",carregarHorarios)

function atualizarLista(){

const lista=document.getElementById("lista")

const adminLista=document.getElementById("adminLista")

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

lista.innerHTML=""
adminLista.innerHTML=""

agenda.forEach((a,i)=>{

lista.innerHTML+=`

<p>
<b>Cliente</b><br>
${a.servico}<br>
${a.profissional}<br>
${a.data} ${a.hora}
</p>
<hr>

`

adminLista.innerHTML+=`

<p>
<b>${a.nome}</b><br>
${a.telefone}<br>
${a.servico}<br>
${a.profissional}<br>
${a.data} ${a.hora}
<br>
<button class="cancelar" onclick="cancelar(${i})">Cancelar</button>
</p>
<hr>

`

})

}

function cancelar(i){

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

agenda.splice(i,1)

localStorage.setItem("agenda",JSON.stringify(agenda))

atualizarLista()

}

function abrirAdmin(){

const senha=prompt("Senha")

if(senha==="1234"){

document.getElementById("admin").style.display="block"

}else{

alert("Senha incorreta")

}

}

document.getElementById("form").addEventListener("submit",function(e){

e.preventDefault()

const nome=document.getElementById("nome").value
const telefone=document.getElementById("telefone").value
const servico=document.getElementById("servico").value
const profissional=document.getElementById("profissional").value
const data=document.getElementById("data").value
const hora=document.getElementById("hora").value

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

agenda.push({nome,telefone,servico,profissional,data,hora})

localStorage.setItem("agenda",JSON.stringify(agenda))

// mensagem WhatsApp

const msg=`
Novo Agendamento

Nome: ${nome}
Telefone: ${telefone}
Serviço: ${servico}
Profissional: ${profissional}
Data: ${data}
Hora: ${hora}
`

const url=`https://wa.me/5586988391451?text=${encodeURIComponent(msg)}`

window.open(url)

alert("Agendamento confirmado!")

atualizarLista()

})

atualizarLista()

</script>

</body>
</html>
