<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Studio Francisca Rodrigues</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

header{
background:linear-gradient(45deg,#e83e8c,#ff7ab6);
color:white;
text-align:center;
padding:35px;
}

section{
max-width:1000px;
margin:auto;
padding:20px;
}

.card-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
cursor:pointer;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

form{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

form input,select,button{
width:100%;
padding:10px;
margin-top:10px;
}

button{
background:#e83e8c;
color:white;
border:none;
border-radius:5px;
}

.horarios{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
gap:10px;
margin-top:15px;
}

.hora{
background:#eee;
padding:10px;
text-align:center;
border-radius:6px;
cursor:pointer;
}

.hora.selecionado{
background:#e83e8c;
color:white;
}

.hora.ocupado{
background:#777;
color:white;
cursor:not-allowed;
}

.lista{
background:white;
padding:20px;
border-radius:10px;
}

.adminBtn{
position:fixed;
bottom:5px;
right:10px;
font-size:10px;
color:#aaa;
cursor:pointer;
}

.stats{
display:none;
gap:20px;
margin-bottom:20px;
}

.stat{
background:white;
padding:15px;
border-radius:10px;
flex:1;
text-align:center;
}

.adminTools{
display:none;
margin-bottom:20px;
}

.cancelar{
background:red;
margin-top:5px;
}

.whats{
background:green;
margin-top:5px;
}

</style>

</head>

<body>

<header>

<h1>Studio Francisca Rodrigues</h1>
<p>Agendamento Online</p>

</header>

<section>

<h2>Serviços</h2>

<div class="card-grid">

<div class="card" onclick="selecionarServico('Unhas')">💅 Unhas</div>
<div class="card" onclick="selecionarServico('Cabelo')">💇 Cabelo</div>
<div class="card" onclick="selecionarServico('Hidratação')">✨ Hidratação</div>

</div>

</section>

<section>

<h2>Agendar</h2>

<form id="form">

<input id="nome" placeholder="Nome" required>

<input id="telefone" placeholder="Telefone" required>

<input id="servico" readonly placeholder="Serviço">

<select id="profissional"></select>

<input type="date" id="data">

<div id="horariosContainer" class="horarios"></div>

<input type="hidden" id="hora">

<button>Confirmar Agendamento</button>

</form>

</section>

<section>

<div id="stats" class="stats">

<div class="stat">
<h3 id="clientesHoje">0</h3>
Clientes Hoje
</div>

<div class="stat">
<h3 id="faturamentoHoje">R$0</h3>
Faturamento Hoje
</div>

</div>

<div id="adminTools" class="adminTools">

<button onclick="backup()">📁 Backup</button>

<button onclick="exportar()">📄 Exportar clientes</button>

<button onclick="ranking()">📊 Ranking profissionais</button>

<button onclick="limpar()">🗑 Limpar agenda</button>

</div>

</section>

<section>

<h2>Agenda</h2>

<div id="agendaLista" class="lista"></div>

</section>

<div class="adminBtn" onclick="login()">admin</div>

<script>

let admin=false

const horariosDisponiveis=[
"08:00","09:00","10:00","11:00",
"13:00","14:00","15:00","16:00","17:00"
]

const profissionais={
Unhas:["Francisca","Vanessa"],
Cabelo:["Leila","Francisca"],
Hidratação:["Leila"]
}

const precos={
Unhas:40,
Cabelo:50,
Hidratação:30
}

function selecionarServico(serv){

servico.value=serv

profissional.innerHTML=""

profissionais[serv].forEach(p=>{

let o=document.createElement("option")
o.value=p
o.textContent=p
profissional.appendChild(o)

})

carregarHorarios()

}

function carregarHorarios(){

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

const container=document.getElementById("horariosContainer")

container.innerHTML=""

horariosDisponiveis.forEach(h=>{

let div=document.createElement("div")

div.className="hora"
div.innerText=h

let ocupado=agenda.some(a=>
a.data==data.value &&
a.hora==h &&
a.profissional==profissional.value
)

if(ocupado){

div.classList.add("ocupado")

}else{

div.onclick=()=>{

document.querySelectorAll(".hora").forEach(x=>x.classList.remove("selecionado"))

div.classList.add("selecionado")

hora.value=h

}

}

container.appendChild(div)

})

}

data.onchange=carregarHorarios
profissional.onchange=carregarHorarios

function login(){

let senha=prompt("Senha admin")

if(senha==="fran4252"){

admin=true

document.getElementById("stats").style.display="flex"
document.getElementById("adminTools").style.display="block"

alert("Modo administrador")

render()

}

}

function render(){

const agenda=JSON.parse(localStorage.getItem("agenda"))||[]

const lista=document.getElementById("agendaLista")

lista.innerHTML=""

let hoje=new Date().toISOString().slice(0,10)

let clientes=0
let faturamento=0

agenda.sort((a,b)=>a.data.localeCompare(b.data)||a.hora.localeCompare(b.hora))

agenda.forEach((a,i)=>{

if(admin){

lista.innerHTML+=`
<div>
<b>${a.nome}</b><br>
${a.telefone}<br>
${a.servico}<br>
${a.profissional}<br>
${a.data} ${a.hora}
<br>
<button class="cancelar" onclick="cancelar(${i})">Cancelar</button>
<button class="whats" onclick="lembrar('${a.telefone}','${a.nome}','${a.data}','${a.hora}')">WhatsApp</button>
</div><hr>`

}else{

lista.innerHTML+=`
<div>
<b>Cliente</b><br>
${a.servico}<br>
${a.profissional}<br>
${a.data} ${a.hora}
</div><hr>`

}

if(a.data===hoje){

clientes++
faturamento+=precos[a.servico]||0

}

})

clientesHoje.innerText=clientes
faturamentoHoje.innerText="R$"+faturamento

}

function cancelar(i){

let agenda=JSON.parse(localStorage.getItem("agenda"))||[]

agenda.splice(i,1)

localStorage.setItem("agenda",JSON.stringify(agenda))

render()

}

function lembrar(tel,nome,data,hora){

let msg=`Olá ${nome}, lembrando seu horário no salão dia ${data} às ${hora}.`

window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`)

}

function backup(){

let dados=localStorage.getItem("agenda")||"[]"

let blob=new Blob([dados])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="agenda_salao.json"

a.click()

}

function exportar(){

let agenda=JSON.parse(localStorage.getItem("agenda"))||[]

let txt="CLIENTES\n\n"

agenda.forEach(a=>{

txt+=`${a.nome} - ${a.telefone} - ${a.servico} - ${a.data} ${a.hora}\n`

})

let blob=new Blob([txt])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="clientes.txt"

a.click()

}

function ranking(){

let agenda=JSON.parse(localStorage.getItem("agenda"))||[]

let cont={}

agenda.forEach(a=>{

cont[a.profissional]=(cont[a.profissional]||0)+1

})

let msg="Ranking de atendimentos\n\n"

for(let p in cont){

msg+=`${p}: ${cont[p]} atendimentos\n`

}

alert(msg)

}

function limpar(){

if(confirm("Apagar agenda?")){

localStorage.removeItem("agenda")

render()

}

}

form.onsubmit=e=>{

e.preventDefault()

let agenda=JSON.parse(localStorage.getItem("agenda"))||[]

let ocupado=agenda.some(a=>
a.data==data.value &&
a.hora==hora.value &&
a.profissional==profissional.value
)

if(ocupado){

alert(profissional.value+" não está disponível nesse horário")

return

}

agenda.push({

nome:nome.value,
telefone:telefone.value,
servico:servico.value,
profissional:profissional.value,
data:data.value,
hora:hora.value

})

localStorage.setItem("agenda",JSON.stringify(agenda))

alert("Agendamento confirmado!")

render()
carregarHorarios()

}

render()

</script>

</body>
</html>
