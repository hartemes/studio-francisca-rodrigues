<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Studio Francisca Rodrigues</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f3f3f3;
}

header{
background:linear-gradient(45deg,#e83e8c,#ff7ab6);
color:white;
text-align:center;
padding:35px;
}

section{
max-width:1000px;
margin:auto;
padding:20px;
}

.card-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
cursor:pointer;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

form{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

form input,select,button{
width:100%;
padding:10px;
margin-top:10px;
}

.horarios{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
gap:10px;
margin-top:15px;
}

.hora{
background:#eee;
padding:10px;
text-align:center;
border-radius:6px;
cursor:pointer;
}

.hora.selecionado{
background:#e83e8c;
color:white;
}

.hora.ocupado{
background:#777;
color:white;
cursor:not-allowed;
}

.lista{
background:white;
padding:20px;
border-radius:10px;
}

.francisca{border-left:6px solid #ff4d6d;padding-left:10px;}
.vanessa{border-left:6px solid orange;padding-left:10px;}
.leila{border-left:6px solid #4dabf7;padding-left:10px;}

.stats{
display:none;
gap:20px;
margin-bottom:20px;
}

.stat{
background:white;
padding:15px;
border-radius:10px;
flex:1;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.adminTools{
display:none;
margin-bottom:20px;
}

button{
background:#e83e8c;
color:white;
border:none;
border-radius:5px;
}

.cancelar{
background:red;
margin-top:5px;
}

.whats{
background:green;
margin-top:5px;
}

.adminBtn{
position:fixed;
bottom:5px;
right:10px;
font-size:10px;
color:#aaa;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<h1>Studio Francisca Rodrigues</h1>
<p>Agendamento Online</p>

</header>

<section>

<h2>Serviços</h2>

<div class="card-grid">

<div class="card" onclick="servico('Unhas')">💅 Unhas</div>
<div class="card" onclick="servico('Cabelo')">💇 Cabelo</div>
<div class="card" onclick="servico('Hidratação')">✨ Hidratação</div>

</div>

</section>

<section>

<h2>Agendar</h2>

<form id="form">

<input type="text" id="nome" placeholder="Nome" required>

<input type="tel" id="telefone" placeholder="Telefone" required>

<input id="servico" readonly placeholder="Serviço">

<select id="profissional"></select>

<input type="date" id="data" required>

<div id="horarios" class="horarios"></div>

<input type="hidden" id="hora">

<button>Confirmar Agendamento</button>

</form>

</section>

<section>

<div id="stats" class="stats">

<div class="stat">
<h3 id="clientesHoje">0</h3>
Clientes hoje
</div>

<div class="stat">
<h3 id="faturamentoHoje">R$0</h3>
Faturamento hoje
</div>

</div>

<div id="adminTools" class="adminTools">

<button onclick="backup()">📁 Backup</button>

<button onclick="exportar()">📄 Exportar clientes</button>

<button onclick="limpar()">🗑 Limpar agenda</button>

</div>

</section>

<section>

<h2>Agenda</h2>

<div id="agenda" class="lista"></div>

</section>

<div class="adminBtn" onclick="login()">admin</div>

<script>

let admin=false

const horarios=["08:00","09:00","10:00","11:00","13:00","14:00","15:00","16:00","17:00"]

const profissionais={
Unhas:["Francisca","Vanessa"],
Cabelo:["Leila","Francisca"],
Hidratação:["Leila"]
}

const precos={
Unhas:40,
Cabelo:50,
Hidratação:30
}

function servico(s){

servico.value=s

let select=profissional

select.innerHTML=""

profissionais[s].forEach(p=>{
let o=document.createElement("option")
o.value=p
o.textContent=p
select.appendChild(o)
})

carregarHorarios()

}

function carregarHorarios(){

let agenda=JSON.parse(localStorage.getItem("agenda"))||[]

let data=dataInput.value
let prof=profissional.value

horariosBox.innerHTML=""

horarios.forEach(h=>{

let div=document.createElement("div")

div.className="hora"
div.innerText=h

let ocupado=agenda.some(a=>a.data==data && a.hora==h && a.profissional==prof)

if(ocupado){

div.classList.add("ocupado")

}else{

div.onclick=()=>{

document.querySelectorAll(".hora").forEach(x=>x.classList.remove("selecionado"))

div.classList.add("selecionado")

hora.value=h

}

}

horariosBox.appendChild(div)

})

}

dataInput.onchange=carregarHorarios
profissional.onchange=carregarHorarios

function login(){

let senha=prompt("Senha admin")

if(senha=="1234"){

admin=true

stats.style.display="flex"
adminTools.style.display="block"

alert("Modo administrador ativado")

render()

}

}

function render(){

let agenda=JSON.parse(localStorage.getItem("agenda"))||[]

agenda.sort((a,b)=>a.data.localeCompare(b.data)||a.hora.localeCompare(b.hora))

agendaBox.innerHTML=""

let hoje=new Date().toISOString().slice(0,10)

let clientes=0
let faturamento=0

agenda.forEach((a,i)=>{

let classe=a.profissional.toLowerCase()

if(admin){

agendaBox.innerHTML+=`

<div class="${classe}">
<b>${a.nome}</b><br>
${a.telefone}<br>
${a.servico}<br>
${a.profissional}<br>
${a.data} ${a.hora}
<br>
<button class="cancelar" onclick="cancelar(${i})">Cancelar</button>
<button class="whats" onclick="lembrar('${a.telefone}','${a.nome}','${a.data}','${a.hora}')">WhatsApp</button>
</div><hr>`

}else{

agendaBox.innerHTML+=`

<div class="${classe}">
<b>Cliente</b><br>
${a.servico}<br>
${a.profissional}<br>
${a.data} ${a.hora}
</div><hr>`

}

if(a.data==hoje){

clientes++
faturamento+=precos[a.servico]||0

}

})

clientesHoje.innerText=clientes
faturamentoHoje.innerText="R$"+faturamento

}

function cancelar(i){

let agenda=JSON.parse(localStorage.getItem("agenda"))||[]

agenda.splice(i,1)

localStorage.setItem("agenda",JSON.stringify(agenda))

render()

}

function lembrar(tel,nome,data,hora){

let msg=`Olá ${nome}, lembrando seu horário no salão dia ${data} às ${hora}.`

window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`)

}

function backup(){

let dados=localStorage.getItem("agenda")||"[]"

let blob=new Blob([dados])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="agenda_salao.json"

a.click()

}

function exportar(){

let agenda=JSON.parse(localStorage.getItem("agenda"))||[]

let texto="CLIENTES\n\n"

agenda.forEach(a=>{
texto+=`${a.nome} - ${a.telefone} - ${a.servico} - ${a.data} ${a.hora}\n`
})

let blob=new Blob([texto])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="clientes.txt"

a.click()

}

function limpar(){

if(confirm("Apagar toda agenda?")){

localStorage.removeItem("agenda")

render()

}

}

form.onsubmit=e=>{

e.preventDefault()

let agenda=JSON.parse(localStorage.getItem("agenda"))||[]

let ocupado=agenda.some(a=>a.data==dataInput.value && a.hora==hora.value && a.profissional==profissional.value)

if(ocupado){

alert(profissional.value+" não está disponível nesse horário")

return

}

agenda.push({
nome:nome.value,
telefone:telefone.value,
servico:servico.value,
profissional:profissional.value,
data:dataInput.value,
hora:hora.value
})

localStorage.setItem("agenda",JSON.stringify(agenda))

alert("Agendamento confirmado!")

render()
carregarHorarios()

}

render()

</script>

</body>
</html>
